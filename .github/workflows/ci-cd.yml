name: Pipeline CI CD pour worldreal
on:
    push:
        branches:
            - master
jobs:
    hello:
        runs-on: ubuntu-latest
        steps:
            - name: Hello GitHub Actions
              run: echo "Hello from Github Actions!"
            - name: Recuperer le code source
              uses: actions/checkout@v4
            - name: lister les fichiers
              run: ls -la
            - name: setup python
              uses: action/setup-python@v7
              with:
                version: '3.10.8'
            - name: version python
              run: python --version
            - name: Install dependencies
              run: pip install -r requirements.txt
            - name: Run unit test
              run: pytest
            

              