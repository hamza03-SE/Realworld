name: Pipeline CI CD pour worldreal
on:
    push:
        branches:
            - master
permissions:
    contents: read
    packages: write
jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - name: Hello GitHub Actions
              run: echo "Hello from Github Actions!"
            - name: Recuperer le code source
              uses: actions/checkout@v4
            - name: lister les fichiers
              run: ls -la
            - name: show Commit 
              run: echo "${{ github.sha }}"
            - name: setup python
              uses: actions/setup-python@v7
              with:
                python-version: '3.9'
            - name: version python
              run: python --version
            - name: Install poetry
              run: pip install poetry
            - name: install dependancies
              run: poetry --version && poetry install --no-root
            # - name: lancer le test
            #   run: poetry run pytest
    build_and_push:
        needs: validate
        runs-on: ubuntu-latest
        steps:
        - name: checkkout the repository
          uses: actions/checkout@v4
        - name: Login au GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        - name: Set image
          run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
        - name: Set tag
          run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
        - name: Show informations
          run: |
            echo "Image: ${{ env.IMAGE_NAME }}"
            echo "Tag: ${{ env.IMAGE_TAG }}"
        - name: build image
          run: docker --version && docker build -t "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" .
        # - name: tag image
        #   run: docker tag ghcr.io/${{ github.repository }}:1.1 ghcr.io/${{ github.actor }}/${{ github.repository }}:1.1
        - name: push image
          run: docker push "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
    
    deploy:
        needs: build_and_push
        runs-on: ubuntu-latest
        environment: production
    

            

              