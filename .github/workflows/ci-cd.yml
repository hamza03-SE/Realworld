name: Pipeline CI CD pour worldreal
on:
    push:
        branches:
            - master
permissions:
    contents: read
    packages: write
jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - name: Hello GitHub Actions
              run: echo "Hello from Github Actions!"
            - name: Recuperer le code source
              uses: actions/checkout@v4
            - name: lister les fichiers
              run: ls -la
            - name: setup python
              uses: actions/setup-python@v7
              with:
                python-version: '3.9'
            - name: version python
              run: python --version
            - name: Install poetry
              run: pip install poetry
            - name: install dependancies
              run: poetry --version && poetry install --no-root
            # - name: lancer le test
            #   run: poetry run pytest
    build_and_push:
        needs: validate
        runs-on: ubuntu-latest
        steps:
        - name: checkkout the repository
          uses: actions/checkout@v4
        - name: Login au GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: build image
          run: docker --version && docker build -t ghcr.io/${{ github.repository }}:1.1 .
        - name: tag image
          run: docker tag ghcr.io/${{ github.repository }}:1.1 ghcr.io/${{ github.actor }}/${{ github.repository }}:1.1
        - name: push image
          run: docker push ghcr.io/${{ github.actor }}/${{ github.repository }}:1.1
    

            

              