services:
  backend:
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    healthcheck:
      test: ["CMD SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5